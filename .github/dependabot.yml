version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: terraform
    directories:
      - /terraform/config
      - /terraform/cluster
      - /terraform/app
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
