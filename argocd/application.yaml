apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quipux-playlist
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leandroAmariles/quipux-playlist-infra.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: quipux-playlist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
