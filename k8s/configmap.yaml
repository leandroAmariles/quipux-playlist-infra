apiVersion: v1
kind: ConfigMap
metadata:
  name: playlist-config
data:
  JWT_TTL: "30m"
  SPOTIFY_ACCOUNTS_BASE_URL: "https://accounts.spotify.com"
  SPOTIFY_API_BASE_URL: "https://api.spotify.com"
  SPOTIFY_TIMEOUT: "5s"
  API_URL: "http://api.quipux-playlist.svc.cluster.local:8080"
  REDIS_HOST: "redis.quipux-playlist.svc.cluster.local"
  REDIS_PORT: "6379"
  GENRES_CACHE_ENABLED: "true"
  GENRES_CACHE_TTL: "24h"
  GENRES_CACHE_TIMEOUT: "1s"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.quipux-playlist.svc.cluster.local:9092"
  PLAYLIST_EVENTS_ENABLED: "true"
  PLAYLIST_EVENTS_TOPIC: "playlist.events"
  PLAYLIST_EVENTS_CONSUMER_GROUP: "playlist-audit"
  PLAYLIST_EVENTS_PUBLISH_TIMEOUT: "2s"
