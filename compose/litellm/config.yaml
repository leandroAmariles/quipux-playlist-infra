# Pasarela de modelos. LiteLLM no combina secciones: lo que defina models.yaml sustituye a lo de aquí,
# así que los ajustes de litellm_settings viven en este archivo y en config.langfuse.yaml.
include:
  - models.yaml

litellm_settings:
  # Sin reintentos: una petición del backend es una petición al modelo.
  num_retries: 0
  request_timeout: 120
  turn_off_message_logging: true
  telemetry: false
