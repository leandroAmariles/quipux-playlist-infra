# Langfuse autoalojado: prompts y trazas. Se añade a la composición de la IA:
#   docker compose -p quipux-ia -f compose.yaml -f compose.ai.yaml -f compose.langfuse.yaml up -d --build
# Basado en el docker-compose.yml oficial de Langfuse 4.77.0, sin su AI Gateway (el de modelos es LiteLLM).
# Necesita bastante memoria: úsalo solo cuando haga falta y detenlo al terminar; por eso no se reinicia solo.
# Solo la web publica un puerto, en 127.0.0.1.
# Las imágenes van fijadas por digest; revisa los avisos de seguridad antes de cambiarlas.

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
  DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}@langfuse-postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?define LANGFUSE_SALT en compose/.env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?define LANGFUSE_ENCRYPTION_KEY (64 hex) en compose/.env}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-after-stores: &after-stores
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.77.0@sha256:2b47d0ae63ae737996a58cc03536a73230c809a2371c230c9bea4b7653a0b6a0
    depends_on: *after-stores
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?define LANGFUSE_NEXTAUTH_SECRET en compose/.env}
      # Organización, proyecto, claves y usuario que se crean al arrancar por primera vez.
      LANGFUSE_INIT_ORG_ID: quipux
      LANGFUSE_INIT_ORG_NAME: Quipux
      LANGFUSE_INIT_PROJECT_ID: playlists
      LANGFUSE_INIT_PROJECT_NAME: Playlists
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?define LANGFUSE_PUBLIC_KEY en compose/.env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?define LANGFUSE_SECRET_KEY en compose/.env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?define LANGFUSE_USER_PASSWORD en compose/.env}
      AUTH_DISABLE_SIGNUP: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.77.0@sha256:1bc3597ff4c953e98ff9ee474a7d634e97664e4df298fdf20f13ecc834c89438
    depends_on: *after-stores
    environment: *langfuse-environment

  langfuse-postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.10.4.207@sha256:4f491abc44d9f4a1747c033c35ddd5bc385521305d85ca8251ba0824ff597035
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    environment:
      REDISCLI_AUTH: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
    command: ["redis-server", "--requirepass", "${LANGFUSE_DB_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    image: cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
    entrypoint: ["sh", "-c"]
    # Crea el bucket antes de arrancar.
    command: ["mkdir -p /data/langfuse && minio server --address ':9000' --console-address ':9001' /data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en compose/.env}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # La pasarela envía una traza por cada llamada de chat. Ni el backend ni la pasarela dependen de Langfuse.
  litellm:
    command: ["--config", "/etc/litellm/config.langfuse.yaml", "--port", "4000"]
    environment:
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?define LANGFUSE_PUBLIC_KEY en compose/.env}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:?define LANGFUSE_SECRET_KEY en compose/.env}
      - LANGFUSE_OTEL_HOST=http://langfuse-web:3000

  api:
    environment:
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?define LANGFUSE_PUBLIC_KEY en compose/.env}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:?define LANGFUSE_SECRET_KEY en compose/.env}

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
