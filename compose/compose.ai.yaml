# Modelos locales y recomendaciones con IA. Se añade a la composición base:
#   docker compose -p quipux-ia -f compose.yaml -f compose.ai.yaml up -d --build
# Las imágenes van fijadas por digest; revisa los avisos de seguridad antes de cambiarlas.

x-ollama-image: &ollama-image ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec

services:
  ollama:
    image: *ollama-image
    environment:
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_KEEP_ALIVE=-1
      # Con el contexto por defecto, un prompt largo se recorta sin error, instrucciones incluidas.
      - OLLAMA_CONTEXT_LENGTH=16384
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Descarga los modelos que falten, los deja cargados y termina.
  ollama-init:
    image: *ollama-image
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      - EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for model in "$$CHAT_MODEL" "$$EMBEDDING_MODEL"; do
          if ollama show "$$model" >/dev/null 2>&1; then
            echo "$$model ya está descargado"
          else
            ollama pull "$$model"
          fi
        done
        # La animación de progreso solo se muestra si la precarga falla.
        preload() {
          ollama run "$$1" "$$2" --keepalive -1m >/dev/null 2>/tmp/preload.log || { cat /tmp/preload.log; exit 1; }
        }
        preload "$$CHAT_MODEL" ""
        preload "$$EMBEDDING_MODEL" "precarga"
        ollama ps
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:v1.111.0@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${AI_API_KEY:?define AI_API_KEY en compose/.env}
      - LITELLM_CHAT_MODEL=ollama_chat/${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      - LITELLM_EMBEDDING_MODEL=ollama/${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Usa la tabla de precios incluida en la imagen en lugar de descargarla al arrancar.
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    volumes:
      - ./litellm:/etc/litellm:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # PostgreSQL con pgvector, solo para el catálogo de canciones. El esquema se crea con el volumen vacío.
  catalog-db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      - POSTGRES_DB=catalog
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=${CATALOG_DB_PASSWORD:?define CATALOG_DB_PASSWORD en compose/.env}
    volumes:
      - catalog-data:/var/lib/postgresql
      - ./catalog-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${CATALOG_DB_PORT:-5433}:5432"
    healthcheck:
      # Por la red: mientras se crea el esquema, PostgreSQL solo atiende en su socket local.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "catalog", "-d", "catalog"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Indexa el catálogo y termina. Repetirlo solo cambia lo que haya cambiado:
  #   docker compose -p quipux-ia -f compose.yaml -f compose.ai.yaml run --rm catalog-index
  catalog-index:
    build: ../../quipux-playlist-backend
    command: ["index-catalog"]
    environment:
      - AI_PROVIDER=openai
      - AI_BASE_URL=http://litellm:4000/v1
      - AI_API_KEY=${AI_API_KEY:?define AI_API_KEY en compose/.env}
      - AI_EMBEDDING_MODEL
      # Un lote de canciones tarda más que una consulta.
      - AI_EMBEDDING_TIMEOUT=120s
      - CATALOG_DB_URL=jdbc:postgresql://catalog-db:5432/catalog
      - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD:?define CATALOG_DB_PASSWORD en compose/.env}
    depends_on:
      catalog-db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: "no"

  # Activa la IA en la API. No depende de los servicios anteriores: arranca aunque no estén.
  api:
    environment:
      - AI_PROVIDER=openai
      - AI_BASE_URL=http://litellm:4000/v1
      - AI_API_KEY=${AI_API_KEY:?define AI_API_KEY en compose/.env}
      - AI_TIMEOUT
      - AI_CHAT_MODEL
      - AI_EMBEDDING_MODEL
      - CATALOG_DB_URL=jdbc:postgresql://catalog-db:5432/catalog
      - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD:?define CATALOG_DB_PASSWORD en compose/.env}
      - CATALOG_RETRIEVAL_TIMEOUT

volumes:
  ollama-models:
  catalog-data:
