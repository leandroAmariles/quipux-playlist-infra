name: quipux-playlist

services:
  redis:
    image: redis:8.12.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  kafka:
    image: apache/kafka-native:4.3.1
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      # La imagen nativa no incluye los scripts de /opt/kafka/bin: se comprueba el puerto del broker.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build: ../../quipux-playlist-backend
    environment:
      - JWT_SECRET=${JWT_SECRET:?define JWT_SECRET en compose/.env}
      - DEMO_USER_PASSWORD=${DEMO_USER_PASSWORD:?define DEMO_USER_PASSWORD en compose/.env}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:?define DEMO_ADMIN_PASSWORD en compose/.env}
      - JWT_TTL
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
      - SPOTIFY_ACCOUNTS_BASE_URL
      - SPOTIFY_API_BASE_URL
      - SPOTIFY_TIMEOUT
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GENRES_CACHE_ENABLED=${GENRES_CACHE_ENABLED:-true}
      - GENRES_CACHE_TTL=${GENRES_CACHE_TTL:-24h}
      - GENRES_CACHE_TIMEOUT=${GENRES_CACHE_TIMEOUT:-1s}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PLAYLIST_EVENTS_ENABLED=${PLAYLIST_EVENTS_ENABLED:-true}
      - PLAYLIST_EVENTS_TOPIC=${PLAYLIST_EVENTS_TOPIC:-playlist.events}
      - PLAYLIST_EVENTS_CONSUMER_GROUP=${PLAYLIST_EVENTS_CONSUMER_GROUP:-playlist-audit}
      - PLAYLIST_EVENTS_PUBLISH_TIMEOUT=${PLAYLIST_EVENTS_PUBLISH_TIMEOUT:-2s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 60s

  web:
    build: ../../quipux-playlist-frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
